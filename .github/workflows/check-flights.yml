name: Check flight prices

on:
  schedule:
    # GitHub НЕ гарантирует эту частоту: при cron */10 минут реальные
    # интервалы между срабатываниями были от ~1 часа до 12 часов (проверено
    # эмпирически на истории прогонов 02-06.08.2026). Но цель сейчас
    # скромная — минимум пара сообщений в сутки — а даже в худшие дни этот
    # cron давал больше; если понадобится надёжнее (не просто "пара раз в
    # день", а прямо часто) — см. README.md, раздел «Внешний триггер».
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Не даём двум прогонам работать параллельно — иначе оба могут одновременно
# читать/коммитить data/state.json и получится гонка состояний.
concurrency:
  group: check-flights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          CHECK_INTERVAL_MINUTES: "10"  # держим в согласии с cron выше — это только для текста в /status, на расписание не влияет
          # Маршрут: летим ИЗ Нячанга (плюс через вьетнамские хабы) ВО
          # Владивосток, не дороже MAX_PRICE_RUB за человека (жёсткий
          # потолок — см. Settings.max_price_rub в config.py, дороже вообще
          # не показываем, в отличие от DEFAULT_BUDGET_RUB).
          ORIGINS: "CXR"
          DESTINATIONS: "VVO"
          ENABLE_HUB_SEARCH: "true"
          MAX_PRICE_RUB: "13000"
          # Без SEARCH_START_DATE/SEARCH_END_DATE — скользящее окно от
          # сегодня на SEARCH_WINDOW_DAYS дней (не конкретная поездка).
          # Фоново мониторим цены ещё +10 дней за пределами этого окна (не
          # показываем как варианты) — только чтобы понимать, дорого сейчас
          # или дёшево относительно более широкого горизонта (market_stats).
          MARKET_CONTEXT_EXTRA_DAYS: "10"
        run: python run_once.py

      - name: Commit updated state
        run: |
          git config user.name "flight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/  # update_offset.txt появляется, только если были новые команды в Telegram
          git diff --staged --quiet || git commit -m "Update bot state [skip ci]"
          git push
