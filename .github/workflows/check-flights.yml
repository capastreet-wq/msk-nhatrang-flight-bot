name: Check flight prices

on:
  schedule:
    # GitHub не гарантирует минутную точность (в пиковые моменты бывают
    # задержки в несколько минут) и может пропускать/сдвигать запуски.
    # 25.07.2026: schedule-триггер не срабатывал ни разу ~4 часа при
    # рабочем cron (ручные workflow_dispatch проходили штатно) — если
    # увидишь похожее, попробуй сначала любое изменение в этом файле
    # (сбрасывает регистрацию расписания у GitHub), потом подожди до часа.
    #
    # Раньше был лимит 30 минут из-за бюджета 2000 бесплатных мин/мес на
    # приватных репо (72 прогона/день на *20 минут превышали лимит). После
    # перевода репозитория в public лимит снят (у публичных репо минуты
    # GitHub Actions бесплатны без ограничения) — раз в 10 минут, чтобы
    # регулярно видеть динамику цен, а не только редкие алерты.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Не даём двум прогонам работать параллельно — иначе оба могут одновременно
# читать/коммитить data/state.json и получится гонка состояний.
concurrency:
  group: check-flights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          CHECK_INTERVAL_MINUTES: "10"  # держим в согласии с cron выше — это только для текста в /status, на расписание не влияет
          # Обратный маршрут: летим ИЗ Нячанга (плюс через вьетнамские хабы)
          # В ЛЮБОЙ из четырёх городов, по приоритету (см. DESTINATION_NAMES
          # и Settings.priority_margin_rub в config.py). MRV — самый
          # приоритетный, дальше KRR, ASF, MOW — предпочитаем более
          # приоритетный, если разница в пределах PRIORITY_MARGIN_RUB.
          ORIGINS: "CXR"
          DESTINATIONS: "MRV,KRR,ASF,MOW"
          ENABLE_HUB_SEARCH: "true"
          SEARCH_START_DATE: "2026-08-04"  # конкретная поездка, не скользящее окно — поменяй тут при новой поездке
          SEARCH_END_DATE: "2026-08-15"
          # Фоново мониторим цены ещё +10 дней после 15.08 (не показываем как
          # варианты) — только чтобы понимать, дорого сейчас или дёшево
          # относительно более широкого горизонта (см. market_stats в bot.py).
          MARKET_CONTEXT_EXTRA_DAYS: "10"
        run: python run_once.py

      - name: Commit updated state
        run: |
          git config user.name "flight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/  # update_offset.txt появляется, только если были новые команды в Telegram
          git diff --staged --quiet || git commit -m "Update bot state [skip ci]"
          git push
