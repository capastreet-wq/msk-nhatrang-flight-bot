name: Check flight prices

on:
  schedule:
    # GitHub не гарантирует минутную точность (в пиковые моменты бывают
    # задержки в несколько минут) и может пропускать/сдвигать запуски.
    #
    # Интервал 30, не 20 минут — это НЕ ориентир из config.py, а расчёт
    # бюджета бесплатных минут GitHub Actions: приватный репозиторий даёт
    # 2000 мин/мес, GitHub округляет каждый прогон вверх до целой минуты.
    # На каждые 20 минут получалось бы ~72 прогона/день * 1 мин = ~2160
    # мин/мес — больше лимита, к концу активных месяцев бот мог бы замолчать.
    # На 30 минут — ~48 прогонов/день * 1 мин = ~1440 мин/мес, с запасом.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Не даём двум прогонам работать параллельно — иначе оба могут одновременно
# читать/коммитить data/state.json и получится гонка состояний.
concurrency:
  group: check-flights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          CHECK_INTERVAL_MINUTES: "30"  # держим в согласии с cron выше — это только для текста в /status, на расписание не влияет
        run: python run_once.py

      - name: Commit updated state
        run: |
          git config user.name "flight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/  # update_offset.txt появляется, только если были новые команды в Telegram
          git diff --staged --quiet || git commit -m "Update bot state [skip ci]"
          git push
